          fill="#FFFFFF"/>
  </g>

  <!-- 눈 -->
  <ellipse cx="24.5" cy="33" rx="2.7" ry="3.4" fill="#111827"/>
  <ellipse cx="39.5" cy="33" rx="2.7" ry="3.4" fill="#111827"/>
  <circle cx="25.5" cy="31.7" r="0.95" fill="#FFFFFF"/>
  <circle cx="40.5" cy="31.7" r="0.95" fill="#FFFFFF"/>

  <!-- 코 -->
  <ellipse cx="32" cy="38.6" rx="2.6" ry="1.9" fill="#FBBF24"/>

  <!-- 수염 -->
  <g stroke="#111827" stroke-width="1.8" stroke-linecap="round">
    <path d="M10.5 33 L18.5 34.2"/>
    <path d="M10.8 39.5 L18.8 38.4"/>
    <path d="M53.5 33 L45.5 34.2"/>
