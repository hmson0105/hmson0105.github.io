    <path d="M45.5 18.5 q6.5 -4.6 8.8 1.2 q-2.6 5.6 -8.8 2.6 Z" fill="#F43F5E"/>
    <circle cx="45.5" cy="20.4" r="2.6" fill="#FB7185"/>
