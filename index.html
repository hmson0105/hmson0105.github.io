<!-- chrome-dark = dark menu, for bright footage.
     Swap to "landing chrome-light" if you replace the video with darker footage. -->
<body class="landing chrome-dark">

  <!-- ==========================================================
       Curtain footage.

       Drop your files here (exact paths, relative to the repo root):

         assets/video/curtain-hero.mp4     H.264 / AAC — the main source
         assets/video/curtain-hero.webm    optional, VP9 — smaller on Chrome
         assets/video/curtain-hero.jpg     poster still, about 1920x1080

       The poster is not optional. It is what shows while the video loads,
       when autoplay is refused (common on mobile in Low Power Mode), when
       the file is missing, and when the visitor prefers reduced motion.
       Export it from a frame of the same footage so the swap is invisible.

       Keep the mp4 under roughly 6 MB — GitHub Pages serves it as a plain
       file with no streaming. 8-12 seconds, silent, seamless loop.
       ========================================================== -->
  <div class="stage">
    <img class="stage-poster" src="assets/video/curtain-hero.jpg" alt="" aria-hidden="true">
    <video class="stage-video" playsinline muted loop autoplay preload="auto"
           poster="assets/video/curtain-hero.jpg" aria-hidden="true" tabindex="-1">
      <source src="assets/video/curtain-hero.webm" type="video/webm">
      <source src="assets/video/curtain-hero.mp4" type="video/mp4">
    </video>
    <div class="stage-scrim"></div>
  </div>
