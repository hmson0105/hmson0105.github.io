<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 이 앱은 자기 파일과 가족 동기화 서버 말고는 아무 데서도 코드를 받거나 데이터를 보내지 않는다. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://awnwytdiweeciilpzhny.supabase.co wss://awnwytdiweeciilpzhny.supabase.co; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>우리집 미니월드</title>
  <!-- 가족 전용 공간: 검색엔진 색인·링크 미리보기를 막는다. 데이터는 이 브라우저에만 저장된다. -->
  <meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex, noai, noimageai">
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" content="#FFE4EE">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="우리집">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="mobile-web-app-capable" content="yes">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%A0%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="family.css?v=33">
</head>
<body>
  <div class="deco" aria-hidden="true"><i>☁️</i><i>⭐</i><i>💗</i><i>☁️</i><i>✨</i></div>

  <header class="top">
    <a class="brand" href="./" aria-label="우리집 미니월드 처음으로">
      <span class="brand-ico" aria-hidden="true">🏠</span>
      <span class="brand-t">우리집 <b>미니월드</b></span>
    </a>
    <p class="top-date" id="topDate"></p>
    <div class="top-right">
      <label class="viewer"><span>지금 보는 사람</span><select id="viewerSel" aria-describedby="viewerNote"></select></label>
      <span id="viewerNote" class="sr">로그인이 아니라 보기 전환이에요</span>
      <button type="button" class="sync-pill" id="syncPill" data-action="view" data-view="sync"></button>
    </div>
  </header>

  <nav class="tabs" aria-label="화면">
    <button type="button" data-action="view" data-view="world">🏠 미니월드</button>
    <button type="button" data-action="view" data-view="cal">📅 가족 캘린더</button>
    <button type="button" data-action="view" data-view="plan">🧳 여행 · 살 것</button>
    <button type="button" data-action="view" data-view="sync">🔗 연동 · 데이터</button>
    <button type="button" data-action="view" data-view="admin">🛠 관리자</button>
  </nav>

  <div id="banner" class="banners"></div>

  <main>
    <!-- 미니월드 -->
    <section class="view world" data-view="world">
      <aside class="dir o-2" aria-label="층별 안내">
        <h2 class="dir-title">층별 안내</h2>
        <div class="building">
          <div class="shaft" aria-hidden="true"><div class="car" id="car">1F</div></div>
          <ol class="floors" id="floorList"></ol>
        </div>
        <p class="dir-note">엘리베이터는 화면 이동 연출이에요.<br>가족의 실제 위치가 아니에요.</p>
      </aside>

      <div class="col-center">
        <section class="stage-card card o-6" aria-label="미니룸">
          <div class="stage-top">
            <header class="card-h" id="stageTitle"></header>
            <div id="floorHead" class="o-1"></div>
          </div>
          <div class="stage-box">
          <div class="stage-frame" id="stageFrame">
            <div class="stage" id="stage">
              <div class="scene-wrap" id="sceneWrap"></div>
              <div class="doors" aria-hidden="true">
                <i class="door l"></i><i class="door r"></i>
                <span class="ind" id="elevInd">1F</span>
              </div>
            </div>
          </div>
          </div>
          <p class="stage-cap">캐릭터 동작은 캘린더 일정이나 직접 설정한 상태로만 정해져요. 상태가 없으면 멈추고, 12시간이 지나면 ‘확인 중’이에요.</p>
        </section>
        <div id="panelMain" class="panels"></div>
      </div>

      <div class="col-side" id="panelSide"></div>
    </section>

    <!-- 캘린더 -->
    <section class="view cal" data-view="cal" hidden>
      <div class="cal-top card">
        <div class="cal-nav">
          <button type="button" class="btn-round" data-action="cal-prev" aria-label="이전">◀</button>
          <button type="button" class="btn-s" data-action="cal-today">오늘</button>
          <button type="button" class="btn-round" data-action="cal-next" aria-label="다음">▶</button>
          <h2 id="calTitle" aria-live="polite"></h2>
        </div>
        <div class="seg" id="calModes" role="group" aria-label="보기">
          <button type="button" data-action="cal-mode" data-mode="month">월</button>
          <button type="button" data-action="cal-mode" data-mode="week">주</button>
          <button type="button" data-action="cal-mode" data-mode="day">하루</button>
        </div>
        <div class="cal-filter" id="calFilter" role="group" aria-label="구성원 필터"></div>
        <div class="cal-add">
          <button type="button" class="btn-p" data-action="new-event">+ 일정</button>
          <button type="button" class="btn-s" data-action="new-issue">+ 이슈</button>
          <button type="button" class="btn-s" data-action="kakao">💬 카톡 글로 등록</button>
        </div>
      </div>
      <div class="cal-body">
        <div class="card cal-grid" id="calGrid"></div>
        <aside class="card cal-day" id="calDay" aria-label="선택한 날"></aside>
      </div>
      <p class="tz-note">시간대: Asia/Seoul (한국 표준시) 기준</p>
    </section>

    <!-- 여행 계획 · 살 것/준비할 것 -->
    <section class="view plan" data-view="plan" hidden>
      <div id="planBody" class="plan-body"></div>
    </section>

    <!-- 관리자 -->
    <section class="view admin" data-view="admin" hidden>
      <div id="adminBody" class="sync-body"></div>
    </section>

    <!-- 연동·데이터 -->
    <section class="view sync" data-view="sync" hidden>
      <div id="syncBody" class="sync-body"></div>
    </section>
  </main>

  <nav class="bottom-nav" aria-label="화면">
    <button type="button" data-action="view" data-view="world"><span aria-hidden="true">🏠</span>홈</button>
    <button type="button" data-action="view" data-view="cal"><span aria-hidden="true">📅</span>캘린더</button>
    <button type="button" data-action="view" data-view="plan"><span aria-hidden="true">🧳</span>여행·살것</button>
    <button type="button" data-action="view" data-view="sync"><span aria-hidden="true">🔗</span>연동</button>
  </nav>

  <dialog id="dlg"></dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">이 페이지는 자바스크립트가 필요해요.</p></noscript>
  <script type="module" src="js/app.js?v=46"></script>
</body>
</html>
